# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                                                                              ║
# ║                   ✦ FRIENDLY CORE - SETTINGS MESSAGES ✦                      ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

# General chat prefix for settings module messages
prefix: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>"

# ──────────────────────────────────────────────────────────────────────────────
# SETTING TOGGLE & STATUS NOTIFICATIONS
# Placeholders: %setting%, %state%, %status%
# ──────────────────────────────────────────────────────────────────────────────
setting-enabled: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>» <color:#E7B85C>%setting% <color:#D8D0C3>ɪѕ ɴᴏᴡ <color:#8DE969><bold>ᴇɴᴀʙʟᴇᴅ</bold></color><color:#D8D0C3>."
setting-disabled: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>» <color:#E7B85C>%setting% <color:#D8D0C3>ɪѕ ɴᴏᴡ <color:#FF4D5A><bold>ᴅɪѕᴀʙʟᴇᴅ</bold></color><color:#D8D0C3>."
setting-set: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>» <color:#E7B85C>%setting% <color:#D8D0C3>ѕᴇᴛ ᴛᴏ %state%<color:#D8D0C3>."
setting-status: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>» <color:#E7B85C>%setting%<color:#D8D0C3>: %status%"

# ──────────────────────────────────────────────────────────────────────────────
# ERROR & RESTRICTION NOTIFICATIONS
# Placeholders: %setting%, %command%
# ──────────────────────────────────────────────────────────────────────────────
no-permission: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜ ᴅᴏ ɴᴏᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪѕѕɪᴏɴ ᴛᴏ ᴛᴏɢɢʟᴇ <color:#E7B85C>%setting%<color:#D8D0C3>."
players-only: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛʜɪѕ ᴄᴏᴍᴍᴀɴᴅ ᴄᴀɴ ᴏɴʟʏ ʙᴇ ᴜѕᴇᴅ ʙʏ ᴘʟᴀʏᴇʀѕ."
unknown-setting: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴜɴᴋɴᴏᴡɴ ѕᴇᴛᴛɪɴɢ: <color:#E7B85C>%setting%<color:#D8D0C3>."
usage: "<gradient:#FFB703:#E7B85C><bold>⚠ ᴡᴀʀɴɪɴɢ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴜѕᴀɢᴇ: <color:#E7B85C>/%command% toggle <setting><color:#D8D0C3>."

# ──────────────────────────────────────────────────────────────────────────────
# ADMINISTRATIVE NOTIFICATIONS
# Placeholders: %time%
# ──────────────────────────────────────────────────────────────────────────────
reloaded: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛᴛɪɴɢѕ ᴄᴏɴғɪɢᴜʀᴀᴛɪᴏɴ ʀᴇʟᴏᴀᴅᴇᴅ ɪɴ <color:#E7B85C>%time%ᴍѕ<color:#D8D0C3>."

# ──────────────────────────────────────────────────────────────────────────────
# INTERACTIVE CHAT INTERFACE
# Displayed when using the interactive text/chat settings menu
# Placeholders: %setting%, %button%, %description%
# ──────────────────────────────────────────────────────────────────────────────
chat-header: "<gradient:#6EDBFF:#A7F3FF><bold>⚙ ᴘʟᴀʏᴇʀ ѕᴇᴛᴛɪɴɢѕ</bold></gradient> <dark_gray>• <color:#8A8A8A>ᴄʟɪᴄᴋ ᴛᴏ ᴛᴏɢɢʟᴇ"
chat-footer: "<dark_gray>─────────────────────────────────────────</dark_gray>"
chat-line: " <dark_gray>• <color:#E7B85C>%setting% %button% <dark_gray>» <color:#D8D0C3>%description%"

# ──────────────────────────────────────────────────────────────────────────────
# COMMAND, GUI AND ADMIN MESSAGES
# ──────────────────────────────────────────────────────────────────────────────
is-now-enabled: "<gray>%display_name_value% is now <green>ENABLED<gray>."
is-now-disabled: "<gray>%display_name_value% is now <red>DISABLED<gray>."
