title: "ᴏʀᴅᴇʀs ({currentPage}/{maxPages})"

items:
  actual_order:
    name: "#E63A35{itemAmount} &f{itemType}"
    lore:
      - "#E63A35${itemPrice_short} &feach"
      - ""
      - "&8▪ #E63A35{currentlyDelivered}/#A14444{totalDelivery} &7Delivered"
      - "&8▪ #E63A35${totalPaid_short}/#A14444${totalPrice_short} &7Paid"
      - ""
      - "&7{formattedExpirationTime} Until Order expires"
    material: "BARRIER"
    sound: click

  back:
    name: "#E63A35« ʙᴀᴄᴋ"
    lore:
      - "&7Return to previous page"
    material: "ARROW"
    slot: 45
    sound: click

  next:
    name: "#E63A35ɴᴇxᴛ »"
    lore:
      - "&7Go to next page"
    material: "ARROW"
    slot: 53
    sound: click

  orders:
    name: "<gradient:#E63A35:#FF6B6B><b>ᴏʀᴅᴇʀs</b></gradient>"
    lore:
      - "&7Click to refresh market"
    material: "MAP"
    slot: 49

  search:
    name: "<gradient:#E63A35:#FF6B6B><b>sᴇᴀʀᴄʜ</b></gradient>"
    lore:
      - "&7Click to search orders"
    material: "OAK_SIGN"
    slot: 50
    sound: click

  your_orders:
    name: "<gradient:#E63A35:#FF6B6B><b>ʏᴏᴜʀ ᴏʀᴅᴇʀs</b></gradient>"
    lore:
      - "&7View and manage your orders"
    material: "CHEST"
    slot: 51
    customModelData: -1
    sound: click

  sort:
    name: "<gradient:#E63A35:#FF6B6B><b>sᴏʀᴛ</b></gradient>"
    material: "CAULDRON"
    selected_color: "#E63A35"
    unselected_color: "&7"
    bullet_icon: "▪ "
    options:
      - "SORT_MOST_PAID"
      - "SORT_MOST_DELIVERED"
      - "SORT_RECENTLY_LISTED"
      - "SORT_MOST_MONEY_PER_ITEM"
    slot: 47
    customModelData: -1
    sound: click

  filter:
    name: "<gradient:#E63A35:#FF6B6B><b>ғɪʟᴛᴇʀ</b></gradient>"
    material: "HOPPER"
    selected_color: "#E63A35"
    unselected_color: "&7"
    bullet_icon: "▪ "
    options:
      - "FILTER_ALL"
      - "FILTER_BLOCKS"
      - "FILTER_TOOLS"
      - "FILTER_FOOD"
      - "FILTER_COMBAT"
      - "FILTER_POTIONS"
      - "FILTER_BOOKS"
      - "FILTER_INGREDIENTS"
      - "FILTER_UTILITIES"
    slot: 48
    customModelData: -1
    sound: click

  filler:
    name: " "
    material: BLACK_STAINED_GLASS_PANE
    slot: [46, 52]

