# ╔══════════════════════════════════════════════════════════════════════════════╗
# ║                                                                              ║
# ║                  ✦ FRIENDLY CORE - ESSENTIALS MESSAGES ✦                     ║
# ║                                                                              ║
# ╚══════════════════════════════════════════════════════════════════════════════╝

essentials:
  # ────────────────────────────────────────────────────────────────────────────
  # GENERAL SYSTEM MESSAGES
  # ────────────────────────────────────────────────────────────────────────────
  general:
    no-permission: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜ ᴅᴏ ɴᴏᴛ ʜᴀᴠᴇ ᴘᴇʀᴍɪѕѕɪᴏɴ ᴛᴏ ᴇxᴇᴄᴜᴛᴇ ᴛʜɪѕ ᴄᴏᴍᴍᴀɴᴅ."
    player-not-found: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴘʟᴀʏᴇʀ <color:#E7B85C>%player%</color> ᴡᴀѕ ɴᴏᴛ ғᴏᴜɴᴅ ᴏɴʟɪɴᴇ."
    world-not-found: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴡᴏʀʟᴅ <color:#E7B85C>%world%</color> ᴅᴏᴇѕ ɴᴏᴛ ᴇxɪѕᴛ."

  # ────────────────────────────────────────────────────────────────────────────
  # GAME MODE MANAGEMENT (/gm, /gamemode)
  # ────────────────────────────────────────────────────────────────────────────
  gamemode:
    invalid-mode: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴᴠᴀʟɪᴅ ɢᴀᴍᴇ ᴍᴏᴅᴇ <color:#E7B85C>%mode%</color>. <dark_gray>(ᴄʀᴇᴀᴛɪᴠᴇ, ѕᴜʀᴠɪᴠᴀʟ, ᴀᴅᴠᴇɴᴛᴜʀᴇ, ѕᴘᴇᴄᴛᴀᴛᴏʀ)</dark_gray>"
    changed-self: "<gradient:#00d2ff:#3a7bd5><bold>✦ ɢᴀᴍᴇᴍᴏᴅᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜʀ ɢᴀᴍᴇ ᴍᴏᴅᴇ ʜᴀѕ ʙᴇᴇɴ ѕᴇᴛ ᴛᴏ <color:#E7B85C>%gamemode%</color>."
    changed-other: "<gradient:#00d2ff:#3a7bd5><bold>✦ ɢᴀᴍᴇᴍᴏᴅᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛ <color:#E7B85C>%player%</color>''ѕ ɢᴀᴍᴇ ᴍᴏᴅᴇ ᴛᴏ <color:#E7B85C>%gamemode%</color>."
    changed-other-network: "<gradient:#00d2ff:#3a7bd5><bold>✦ ɢᴀᴍᴇᴍᴏᴅᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇɴᴛ ɢᴀᴍᴇ ᴍᴏᴅᴇ <color:#E7B85C>%gamemode%</color> ᴛᴏ <color:#E7B85C>%player%</color> ᴀᴄʀᴏѕѕ ɴᴇᴛᴡᴏʀᴋ."

  # ────────────────────────────────────────────────────────────────────────────
  # INVENTORY INSPECTION (/invsee)
  # ────────────────────────────────────────────────────────────────────────────
  invsee:
    usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C><player></color>"
    no-self: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜ ᴄᴀɴɴᴏᴛ ɪɴѕᴘᴇᴄᴛ ʏᴏᴜʀ ᴏᴡɴ ɪɴᴠᴇɴᴛᴏʀʏ."
    exempt: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴘʟᴀʏᴇʀ <color:#E7B85C>%player%</color> ɪѕ ᴇxᴇᴍᴘᴛ ғʀᴏᴍ ɪɴѕᴘᴇᴄᴛɪᴏɴ."
    requesting-remote: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ɴᴇᴛᴡᴏʀᴋ</bold></gradient> <dark_gray>» <color:#D8D0C3>ғᴇᴛᴄʜɪɴɢ <color:#E7B85C>%player%</color>''ѕ ɪɴᴠᴇɴᴛᴏʀʏ ғʀᴏᴍ ʀᴇᴍᴏᴛᴇ ѕᴇʀᴠᴇʀ..."
    target-disconnected: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴅɪѕᴄᴏɴɴᴇᴄᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴѕᴘᴇᴄᴛɪᴏɴ ᴄʟᴏѕᴇᴅ: <color:#E7B85C>%player%</color> ʜᴀѕ ᴅɪѕᴄᴏɴɴᴇᴄᴛᴇᴅ."

  # ────────────────────────────────────────────────────────────────────────────
  # ENDER CHEST INSPECTION (/enderchest, /ec)
  # ────────────────────────────────────────────────────────────────────────────
  enderchest:
    requesting-remote: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ɴᴇᴛᴡᴏʀᴋ</bold></gradient> <dark_gray>» <color:#D8D0C3>ғᴇᴛᴄʜɪɴɢ <color:#E7B85C>%player%</color>''ѕ ᴇɴᴅᴇʀ ᴄʜᴇѕᴛ ғʀᴏᴍ ʀᴇᴍᴏᴛᴇ ѕᴇʀᴠᴇʀ..."
    target-disconnected: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴅɪѕᴄᴏɴɴᴇᴄᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴѕᴘᴇᴄᴛɪᴏɴ ᴄʟᴏѕᴇᴅ: <color:#E7B85C>%player%</color> ʜᴀѕ ᴅɪѕᴄᴏɴɴᴇᴄᴛᴇᴅ."

  # ────────────────────────────────────────────────────────────────────────────
  # PLAYER SPEED CONTROLS (/speed, /flyspeed, /walkspeed)
  # ────────────────────────────────────────────────────────────────────────────
  speed:
    usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C>[fly|walk] <0..10> [player]</color>"
    invalid-speed: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴᴠᴀʟɪᴅ ѕᴘᴇᴇᴅ <color:#E7B85C>%speed%</color>. <dark_gray>(ѕᴘᴇᴄɪғʏ 0 ᴛᴏ 10)</dark_gray>"
    fly-changed-self: "<gradient:#6EDBFF:#A7F3FF><bold>✈ ғʟɪɢʜᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜʀ ғʟʏɪɴɢ ѕᴘᴇᴇᴅ ʜᴀѕ ʙᴇᴇɴ ѕᴇᴛ ᴛᴏ <color:#E7B85C>%speed%</color>."
    walk-changed-self: "<gradient:#7BD88F:#B9FBC0><bold>✦ ѕᴘᴇᴇᴅ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜʀ ᴡᴀʟᴋɪɴɢ ѕᴘᴇᴇᴅ ʜᴀѕ ʙᴇᴇɴ ѕᴇᴛ ᴛᴏ <color:#E7B85C>%speed%</color>."
    changed-other: "<gradient:#7BD88F:#B9FBC0><bold>✦ ѕᴘᴇᴇᴅ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛ <color:#E7B85C>%player%</color>''ѕ %type% ѕᴘᴇᴇᴅ ᴛᴏ <color:#E7B85C>%speed%</color>."
    changed-other-network: "<gradient:#7BD88F:#B9FBC0><bold>✦ ѕᴘᴇᴇᴅ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇɴᴛ %type% ѕᴘᴇᴇᴅ <color:#E7B85C>%speed%</color> ғᴏʀ <color:#E7B85C>%player%</color> ᴀᴄʀᴏѕѕ ɴᴇᴛᴡᴏʀᴋ."

  # ────────────────────────────────────────────────────────────────────────────
  # TIME MANAGEMENT (/time)
  # ────────────────────────────────────────────────────────────────────────────
  time:
    usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C><set|add> <time> [world|all|network]</color>"
    current: "<gradient:#E7B85C:#FFD166><bold>☀ ᴛɪᴍᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴄᴜʀʀᴇɴᴛ ᴛɪᴍᴇ ɪɴ <color:#E7B85C>%world%</color> ɪѕ <color:#E7B85C>%time%</color> ᴛɪᴄᴋѕ."
    invalid-time: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴᴠᴀʟɪᴅ ᴛɪᴍᴇ ғᴏʀᴍᴀᴛ <color:#E7B85C>%time%</color>."
    set: "<gradient:#E7B85C:#FFD166><bold>☀ ᴛɪᴍᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛ ᴛɪᴍᴇ ᴛᴏ <color:#E7B85C>%time%</color> ɪɴ <color:#E7B85C>%world%</color>."
    added: "<gradient:#E7B85C:#FFD166><bold>☀ ᴛɪᴍᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴀᴅᴅᴇᴅ <color:#E7B85C>%time%</color> ᴛɪᴄᴋѕ ᴛᴏ <color:#E7B85C>%world%</color>."

  # ────────────────────────────────────────────────────────────────────────────
  # WEATHER MANAGEMENT (/weather)
  # ────────────────────────────────────────────────────────────────────────────
  weather:
    usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C><sun|rain|storm> [duration] [world|all|network]</color>"
    invalid-type: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴᴠᴀʟɪᴅ ᴡᴇᴀᴛʜᴇʀ ᴛʏᴘᴇ <color:#E7B85C>%type%</color>. <dark_gray>(ѕᴜɴ, ʀᴀɪɴ, ѕᴛᴏʀᴍ)</dark_gray>"
    sun: "<gradient:#E7B85C:#FFD166><bold>☀ ᴡᴇᴀᴛʜᴇʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛ ᴡᴇᴀᴛʜᴇʀ ᴛᴏ <color:#7BD88F>ᴄʟᴇᴀʀ ѕᴜɴ</color> ɪɴ <color:#E7B85C>%world%</color> <dark_gray>(%duration%ѕ)</dark_gray>."
    storm: "<gradient:#6EDBFF:#A7F3FF><bold>⛈ ᴡᴇᴀᴛʜᴇʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴇᴛ ᴡᴇᴀᴛʜᴇʀ ᴛᴏ <color:#6EDBFF>ѕᴛᴏʀᴍ</color> ɪɴ <color:#E7B85C>%world%</color> <dark_gray>(%duration%ѕ)</dark_gray>."

  # ────────────────────────────────────────────────────────────────────────────
  # TELEPORTATION SUITE (/tp, /tphere, /top, /bottom, /jump, /tpall)
  # ────────────────────────────────────────────────────────────────────────────
  teleport:
    usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C><player> [destination|x y z]</color> ᴏʀ <color:#E7B85C><x> <y> <z> [world]</color>"
    here-usage: "<gradient:#FFD166:#FFB347><bold>⚠ ᴜѕᴀɢᴇ</bold></gradient> <dark_gray>» <color:#D8D0C3>/%label% <color:#E7B85C><player></color>"
    self-teleport: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜ ᴄᴀɴɴᴏᴛ ᴛᴇʟᴇᴘᴏʀᴛ ᴛᴏ ʏᴏᴜʀѕᴇʟғ."
    teleported-to-player: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ <color:#E7B85C>%player%</color>."
    teleported-other-to-player: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <color:#E7B85C>%player%</color> ᴛᴏ <color:#E7B85C>%target%</color>."
    teleported-to-coords: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ <color:#E7B85C>%world%</color> <dark_gray>(%x%, %y%, %z%)</dark_gray>."
    teleported-other-to-coords: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <color:#E7B85C>%player%</color> ᴛᴏ <color:#E7B85C>%world%</color> <dark_gray>(%x%, %y%, %z%)</dark_gray>."
    invalid-coords: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɪɴᴠᴀʟɪᴅ ᴄᴏᴏʀᴅɪɴᴀᴛᴇѕ ѕᴘᴇᴄɪғɪᴇᴅ."
    locating-remote: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ᴛᴇʟᴇᴘᴏʀᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʟᴏᴄᴀᴛɪɴɢ <color:#E7B85C>%player%</color> ᴀᴄʀᴏѕѕ ɴᴇᴛᴡᴏʀᴋ..."
    cross-server-connecting: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ᴛᴇʟᴇᴘᴏʀᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴄᴏɴɴᴇᴄᴛɪɴɢ ᴛᴏ ѕᴇʀᴠᴇʀ <color:#6EDBFF>%server%</color> ᴛᴏ ʀᴇᴀᴄʜ <color:#E7B85C>%player%</color>..."
    teleported-arrival: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴜᴄᴄᴇѕѕғᴜʟʟʏ ᴀʀʀɪᴠᴇᴅ ᴀᴛ ᴅᴇѕᴛɪɴᴀᴛɪᴏɴ!"
    pulling-remote: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ᴛᴇʟᴇᴘᴏʀᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ѕᴜᴍᴍᴏɴɪɴɢ <color:#E7B85C>%player%</color> ғʀᴏᴍ ʀᴇᴍᴏᴛᴇ ѕᴇʀᴠᴇʀ..."
    teleported-player-here: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <color:#E7B85C>%player%</color> ᴛᴏ ʏᴏᴜʀ ʟᴏᴄᴀᴛɪᴏɴ."
    teleported-to-admin: "<gradient:#6EDBFF:#A7F3FF><bold>⇄ ᴛᴇʟᴇᴘᴏʀᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ʏᴏᴜ ʜᴀᴠᴇ ʙᴇᴇɴ ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ ᴀᴅᴍɪɴ <color:#E7B85C>%admin%</color>."
    tpall-success: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ <color:#E7B85C>%count%</color> ᴘʟᴀʏᴇʀѕ ᴛᴏ ʏᴏᴜʀ ʟᴏᴄᴀᴛɪᴏɴ."
    teleported-top: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ ᴛʜᴇ ʜɪɢʜᴇѕᴛ ѕᴏʟɪᴅ ʙʟᴏᴄᴋ."
    teleported-bottom: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ ᴛʜᴇ ʟᴏᴡᴇѕᴛ ѕᴏʟɪᴅ ɢʀᴏᴜɴᴅ."
    teleported-jump: "<gradient:#7BD88F:#B9FBC0><bold>✔ ѕᴜᴄᴄᴇѕѕ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴛᴇʟᴇᴘᴏʀᴛᴇᴅ ᴛᴏ ᴛᴀʀɢᴇᴛᴇᴅ ʟᴏᴄᴀᴛɪᴏɴ."
    no-safe-location: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴄᴏᴜʟᴅ ɴᴏᴛ ғɪɴᴅ ᴀ ѕᴀғᴇ ɢʀᴏᴜɴᴅ ʟᴏᴄᴀᴛɪᴏɴ."
    no-target-block: "<gradient:#FF4D5A:#FF9A9A><bold>✘ ᴇʀʀᴏʀ</bold></gradient> <dark_gray>» <color:#D8D0C3>ɴᴏ ѕᴏʟɪᴅ ʙʟᴏᴄᴋ ɪɴ ʟɪɴᴇ ᴏғ ѕɪɢʜᴛ ᴡɪᴛʜɪɴ ʀᴀɴɢᴇ."

  # ────────────────────────────────────────────────────────────────────────────
  # FLIGHT MODE CONTROLS (/fly)
  # ────────────────────────────────────────────────────────────────────────────
  fly:
    enabled-self: "<gradient:#6EDBFF:#A7F3FF><bold>✈ ғʟɪɢʜᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ғʟɪɢʜᴛ ᴍᴏᴅᴇ <color:#7BD88F>ᴇɴᴀʙʟᴇᴅ</color>."
    disabled-self: "<gradient:#6EDBFF:#A7F3FF><bold>✈ ғʟɪɢʜᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ғʟɪɢʜᴛ ᴍᴏᴅᴇ <color:#FF4D5A>ᴅɪѕᴀʙʟᴇᴅ</color>."
    enabled-other: "<gradient:#6EDBFF:#A7F3FF><bold>✈ ғʟɪɢʜᴛ</bold></gradient> <dark_gray>» <color:#D8D0C3>ᴇɴᴀʙʟᴇᴅ ғʟɪɢʜᴛ ᴍᴏᴅᴇ ғᴏʀ <color:#E7B85C>%player%</color>."
