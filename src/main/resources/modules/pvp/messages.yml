  combat-logged-broadcast: "<color:#FF4D5A>☠ <color:#E7B85C>%player%</color> ʟᴏɢɢᴇᴅ ᴏᴜᴛ ᴡʜɪʟᴇ ɪɴ ᴄᴏᴍʙᴀᴛ ᴀɴᴅ ᴡᴀs sʟᴀɪɴ!</color>"
  npc-spawned-broadcast: "<color:#FF4D5A>⚠ <color:#E7B85C>%player%</color> ʟᴏɢɢᴇᴅ ᴏᴜᴛ ɪɴ ᴄᴏᴍʙᴀᴛ! ᴀ ᴄᴏᴍʙᴀᴛ ʟᴏɢɢᴇʀ ɴᴘᴄ ʜᴀs ʙᴇᴇɴ sᴘᴀᴡɴᴇᴅ!</color>"
  npc-slain-broadcast: "<color:#FF4D5A>☠ <color:#E7B85C>%player%'s</color> ᴄᴏᴍʙᴀᴛ ʟᴏɢɢᴇʀ ɴᴘᴄ ᴡᴀs sʟᴀɪɴ ʙʏ <white>%killer%</white>!</color>"
