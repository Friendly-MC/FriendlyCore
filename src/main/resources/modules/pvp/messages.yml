  untagged: "<color:#8DE969>✔ ʏᴏᴜ ᴀʀᴇ ɴᴏ ʟᴏɴɢᴇʀ ɪɴ ᴄᴏᴍʙᴀᴛ. ʏᴏᴜ ᴍᴀʏ ɴᴏᴡ sᴀғᴇʟʏ ʟᴏɢ ᴏᴜᴛ.</color>"
