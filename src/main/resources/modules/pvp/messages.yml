  npc-rejoined: "<color:#8DE969>✔ ʏᴏᴜ ʀᴇᴊᴏɪɴᴇᴅ ᴀɴᴅ ʀᴇᴛᴜʀɴᴇᴅ ᴛᴏ ʏᴏᴜʀ ᴄᴏᴍʙᴀᴛ ʟᴏɢɢᴇʀ ɴᴘᴄ!</color>"
  slain-while-offline: "<color:#FF4D5A>☠ ʏᴏᴜʀ ᴄᴏᴍʙᴀᴛ ʟᴏɢɢᴇʀ ɴᴘᴄ ᴡᴀs sʟᴀɪɴ ᴡʜɪʟᴇ ʏᴏᴜ ᴡᴇʀᴇ ᴏғғʟɪɴᴇ!</color>"
