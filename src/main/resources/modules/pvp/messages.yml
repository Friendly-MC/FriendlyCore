  disabled-attack: "<color:#FF4D5A>⚠ ʏᴏᴜʀ ɴᴇᴡʙɪᴇ ᴘʀᴏᴛᴇᴄᴛɪᴏɴ ᴡᴀs ʀᴇᴍᴏᴠᴇᴅ ʙᴇᴄᴀᴜsᴇ ʏᴏᴜ ᴀᴛᴛᴀᴄᴋᴇᴅ ᴀ ᴘʟᴀʏᴇʀ!</color>"
  blocked-attack-them: "<color:#FF4D5A>✘ ʏᴏᴜ ᴄᴀɴɴᴏᴛ ᴀᴛᴛᴀᴄᴋ ᴏᴛʜᴇʀ ᴘʟᴀʏᴇʀs ᴡʜɪʟᴇ ʏᴏᴜ ʜᴀᴠᴇ ɴᴇᴡʙɪᴇ ᴘʀᴏᴛᴇᴄᴛɪᴏɴ!</color>"
