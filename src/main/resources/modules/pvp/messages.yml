  expired: "<color:#E7B85C>⚠ ʏᴏᴜʀ ɴᴇᴡʙɪᴇ ᴘʀᴏᴛᴇᴄᴛɪᴏɴ ʜᴀs ᴇxᴘɪʀᴇᴅ. ᴘᴠᴘ ɪs ɴᴏᴡ ᴀᴄᴛɪᴠᴇ!</color>"
