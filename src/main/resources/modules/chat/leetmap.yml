# ╚══════════════════════════════════════════════════════════════════════════════╝

# ──────────────────────────────────────────────────────────────────────────────
# CHARACTER NORMALIZATION MAPPINGS
# ──────────────────────────────────────────────────────────────────────────────
# Maps leetspeak, numbers, and stylized symbols back to standard alphabet letters
# This allows the filter engine to catch obfuscated profanity and bypass attempts
map:
  a: ["a", "@", "4", "/\\", "^"]
  b: ["b", "8"]
  c: ["c", "(", "<", "{"]
  d: ["d", "|)"]
  e: ["e", "3", "€"]
  f: ["f", "#", "ph"]
  g: ["g", "9", "6"]
  h: ["h", "#"]
  i: ["i", "1", "!", "|", "l"]
  j: ["j"]
  k: ["k", "|<"]
  l: ["l", "1", "|", "!"]
  m: ["m", "|/|", "/\\/\\"]
  n: ["n", "|\\|", "/\\/"]
  o: ["o", "0", "(", ")"]
  p: ["p", "|*"]
  q: ["q", "9"]
  r: ["r"]
  s: ["s", "5", "$"]
  t: ["t", "7", "+"]
  u: ["u", "v", "|_|"]
  v: ["v", "\\/"]
  w: ["w", "\\/\\/", "vv"]
  x: ["x", "%"]
  y: ["y"]
  z: ["z", "2"]
