name: FriendlyCore
version: '${project.version}-dev+${git.total.commit.count}-${git.commit.id.abbrev}'
main: dev.lyy.friendlycore.FriendlyCore
api-version: '1.21.11'
folia-supported: true
description: All-in-One High-Performance Core Plugin
authors: [ Lyy ]

libraries:
  - com.zaxxer:HikariCP:7.1.0
  - org.xerial:sqlite-jdbc:3.53.4.0
  - com.mysql:mysql-connector-j:9.7.0
  - com.h2database:h2:2.1.214
  - redis.clients:jedis:8.0.2

softdepend:
  - ViaVersion
  - FriendlySync
  - Worlds
  - Vault
  - PlaceholderAPI
  - WorldGuard
  - Lands
  - AutoPickup
  - MC-Data-Bridge
  - MCDataBridge
  - mc-data-bridge
  - DataBridge
  - floodgate
  - Geyser-Spigot

loadbefore:
  - PvPManager
  - AxAuctions
  - AxKills
  - AxMines
  - DonutOrder
  - ShopGUIPlus
  - Shopkeepers
  - ChestShop
  - QuickShop
  - ExcellentShop
  - AuctionHouse
  - EconomyShopGUI

provides:
  - Economy

commands:
  afk:
    description: Connect to the AFK server after a cancellable warmup
    permission: friendlycore.afk.use
    usage: /<command>
  friendlycore:
    description: Main command for FriendlyCore management
    aliases: [fc]
    permission: friendlycore.use
    usage: /<command> [reload|createkit|delkit|givekit|kitlist]
  bal:
    description: Check your balance or another player's balance
    aliases: [balance, money]
    permission: friendlycore.economy.bal
    usage: /<command> [player]
  baltop:
    description: View the top wealthiest players on the server or network
    aliases: [balancetop, moneytop, topbal]
    permission: friendlycore.economy.baltop
    usage: /<command> [page]
  pay:
    description: Send money to an online or network player
    permission: friendlycore.economy.pay
    usage: /<command> <player> <amount>
  paytoggle:
    description: Toggle whether you can receive payments from players
    aliases: [togglepay, toggle]
    permission: friendlycore.economy.paytoggle
    usage: /<command>
  payhistory:
    description: View recent payment transactions
    aliases: [transactionhistory, history]
    permission: friendlycore.economy.payhistory
    usage: /<command> [player]
  economy:
    description: Manage player balances and economy system
    aliases: [eco]
    permission: friendlycore.economy.admin
    usage: /<command> <give|take|set|reset|see> <player|*> <amount>
  payreload:
    description: Reload economy and payment configurations
    aliases: [ecoreload, swiftpayreload]
    permission: friendlycore.economy.admin
    usage: /<command>
  tools:
    description: Open the custom tools menu or give drills and choppers
    aliases: [utools, unicorntools, customtools]
    permission: friendlycore.tools.use
    usage: /<command> [give <player> <drill|chopper> <material>]
  kit:
    description: Claim or preview an available kit
    aliases: [kits, pk, playerkits, playerkits2]
    permission: friendlycore.kits.use
    usage: /<command> [kitname]
  setspawn:
    description: Set the global server spawn point
    permission: friendlycore.spawn.set
    usage: /<command>
  spawn:
    description: Teleport to the server spawn point
    permission: friendlycore.spawn.use
    usage: /<command> [player]
  telegram:
    description: View Telegram rank purchase info and links
    permission: friendlycore.spawn.telegram
    usage: /<command>
  tpa:
    description: Send a teleport request to a player
    permission: donuttpa.tpa
    usage: /<command> <player>
  tpahere:
    description: Send a teleport-here request to a player
    permission: donuttpa.tphere
    usage: /<command> <player>
  tpaccept:
    description: Accept a pending teleport request
    aliases: [tpyes]
    permission: donuttpa.accept
    usage: /<command> [player]
  tpdeny:
    description: Deny a pending teleport request
    aliases: [tpno]
    permission: donuttpa.deny
    usage: /<command> [player]
  tpacancel:
    description: Cancel outgoing teleport requests
    aliases: [tpcancel]
    permission: donuttpa.cancel
    usage: /<command>
  tpaall:
    description: Send a teleport request to every online player
    permission: donuttpa.tpaall
    usage: /<command>
  tphereall:
    description: Forcibly teleport all online players to you
    permission: donuttpa.tphereall
    usage: /<command>
  tpatoggle:
    description: Toggle whether you can receive TPA requests
    permission: donuttpa.toggle
    usage: /<command>
  tpaheretoggle:
    description: Toggle whether you can receive TPHere requests
    permission: donuttpa.toggle
    usage: /<command>
  tpauto:
    description: Toggle auto-accepting teleport requests
    permission: donuttpa.auto
    usage: /<command>
  tpaguitoggle:
    description: Toggle whether confirmation GUI is opened on requests
    permission: donuttpa.gui
    usage: /<command>
  tpasetting:
    description: Open personal TPA settings menu
