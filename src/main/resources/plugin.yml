permissions:
  friendlycore.afk.use:
    description: Allows connecting to the AFK server
    default: true
  friendlycore.orders.use:
    description: Allows accessing the buy orders marketplace
    default: true
  friendlycore.orders.create:
    description: Allows creating buy orders
    default: true
  friendlycore.orders.admin:
    description: Allows full administrative control of buy orders
    default: op
  friendlycore.auctions.use:
    description: Allows accessing the auction house
    default: true
  friendlycore.auctions.sell:
    description: Allows creating auction house listings
    default: true
  friendlycore.auctions.open:
    description: Allows opening auction menus
    default: true
  friendlycore.auctions.search:
    description: Allows searching auction listings
    default: true
  friendlycore.auctions.view:
    description: Allows viewing another player's listings
    default: true
  friendlycore.auctions.history:
    description: Allows viewing auction history
    default: true
  friendlycore.auctions.deleted:
    description: Allows viewing personal deleted auctions
    default: true
  friendlycore.auctions.help:
    description: Allows viewing auction help
    default: true
  friendlycore.auctions.limit.1:
    description: Sets the default AxAuctions-compatible listing limit
    default: true
  friendlycore.auctions.admin:
    description: Allows full administrative control of the auction house
    default: op
  friendlycore.auctions.limit.bypass:
    description: Bypasses listing limit restrictions
    default: op
  friendlycore.auctions.history.admin.take:
    description: Allows cloning items from transaction history
    default: op
  friendlycore.auctions.deleted.admin.take:
    description: Allows restoring items from deleted archive
    default: op
  axauctions.use:
    description: Alias permission for friendlycore.auctions.use
    default: true
  axauctions.sell:
    description: Alias permission for friendlycore.auctions.sell
    default: true
  axauctions.open:
    description: AxAuctions-compatible menu permission
    default: true
  axauctions.search:
    description: AxAuctions-compatible search permission
    default: true
  axauctions.view:
    description: AxAuctions-compatible listing-view permission
    default: true
  axauctions.history:
    description: AxAuctions-compatible history permission
    default: true
  axauctions.deleted:
    description: AxAuctions-compatible deleted-items permission
    default: true
  axauctions.help:
    description: AxAuctions-compatible help permission
    default: true
  axauctions.limit.1:
    description: AxAuctions-compatible default listing limit
    default: true
  axauctions.admin:
    description: Alias permission for friendlycore.auctions.admin
    default: op
  axauctions.forceopen:
    description: AxAuctions-compatible permission to open menus for another player
    default: op
  axauctions.history.admin:
    description: AxAuctions-compatible permission to inspect global or player history
